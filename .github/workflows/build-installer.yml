name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update the public GitHub Release after a successful build"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Release tag to publish"
        required: true
        type: string
        default: "v10.0.2"
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build MCHOSE Battery Tray
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Verify app and installer versions
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\MCHOSE.BatteryTray.csproj -Raw
          $versionNode = $project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1
          $version = [string]$versionNode.Version
          $issText = Get-Content .\installer\MCHOSE-Battery-Tray.iss -Raw
          $match = [regex]::Match($issText, '(?m)^#define\s+MyAppVersion\s+"([^"]+)"')
          if (-not $version) { throw 'Version is missing from src/MCHOSE.BatteryTray.csproj' }
          if (-not $match.Success) { throw 'MyAppVersion is missing from installer/MCHOSE-Battery-Tray.iss' }
          $installerVersion = $match.Groups[1].Value
          if ($version -ne $installerVersion) {
            throw "Version mismatch: csproj=$version, installer=$installerVersion"
          }
          $iconSource = Get-Content .\src\IconFactory.cs -Raw
          if ($iconSource -notmatch '\.DrawString\(') {
            throw 'Expected the DrawString-based tray icon renderer.'
          }
          if ($iconSource -match 'path\.AddString\(') {
            throw 'The old GraphicsPath.AddString renderer is still present.'
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified application and installer version: $version"

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish .\src\MCHOSE.BatteryTray.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            --output .\publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          $exe = Get-Item .\publish\MCHOSE.BatteryTray.exe -ErrorAction Stop
          Write-Host "Published EXE: $($exe.FullName)"
          Write-Host "Product version: $($exe.VersionInfo.ProductVersion)"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\dist -Force | Out-Null
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler .\installer\MCHOSE-Battery-Tray.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = Get-ChildItem .\dist\MCHOSE-Battery-Tray-Setup-*.exe -ErrorAction Stop
          $setup | Format-Table Name, Length

      - name: Package portable legacy edition
        shell: pwsh
        run: |
          $portableDir = Join-Path $PWD 'dist\portable'
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item .\portable\* $portableDir -Recurse -Force
          Copy-Item .\LICENSE, .\CONTRIBUTORS.md $portableDir -Force
          $portableZip = '.\dist\MCHOSE-Battery-Tray-Portable-v9.0.zip'
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath $portableZip -Force
          if (-not (Test-Path $portableZip)) { throw 'Portable ZIP was not created.' }
          Write-Host "Created portable archive: $portableZip"

      - name: Upload release packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MCHOSE-Battery-Tray-Packages-${{ env.APP_VERSION }}
          path: |
            .\dist\MCHOSE-Battery-Tray-Setup-*.exe
            .\dist\MCHOSE-Battery-Tray-Portable-v9.0.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: main
          name: MCHOSE Battery Tray ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            .\dist\MCHOSE-Battery-Tray-Setup-*.exe
            .\dist\MCHOSE-Battery-Tray-Portable-v9.0.zip
          generate_release_notes: true
